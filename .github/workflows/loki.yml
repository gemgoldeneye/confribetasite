name: Visual Regression (Loki)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  loki:
    name: Loki snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @confri/storybook build

      - name: Run Loki visual regression
        run: pnpm --filter @confri/storybook loki
        working-directory: apps/storybook
